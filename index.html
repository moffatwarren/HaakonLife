<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c1c24">
<title>Richmond Office</title>
<style>
  :root {
    --bg: #1c1c24;
    --shell: #2c2c38;
    --btn: #3a3a48;
    --btn-down: #22222c;
    --ab: #a8285a;
    --ab-down: #7a1840;
    --label: #8a8aa0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #app {
    position: fixed; inset: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display: grid; place-items: center; place-content: center; gap: 14px;
    grid-template-areas: "screen" "keys";
  }
  #screen-wrap {
    grid-area: screen;
    background: var(--shell); padding: 12px; border-radius: 10px 10px 28px 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.04);
  }
  #screen {
    display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    background: #000; border-radius: 2px;
  }
  #keys { grid-area: keys; color: var(--label); font-size: 13px; text-align: center; line-height: 1.6; padding: 0 16px; }
  #keys b { color: #c8c8d8; font-weight: 600; }
  #dpad, #meta, #ab { display: none; }

  /* ---------- touch controls ---------- */
  body.touch #keys { display: none; }
  body.touch #dpad, body.touch #meta, body.touch #ab { display: flex; }
  body.touch.portrait #app {
    grid-template-areas: "screen screen" "dpad ab" "meta meta";
    grid-template-columns: 1fr 1fr; align-content: space-evenly; gap: 10px 0;
  }
  body.touch.landscape #app {
    grid-template-areas: "dpad screen ab" "dpad meta ab";
    grid-template-columns: 1fr auto 1fr; gap: 6px 10px;
  }
  #dpad {
    grid-area: dpad; position: relative; width: 150px; height: 150px; touch-action: none;
  }
  #dpad .arm { position: absolute; background: var(--btn); box-shadow: 0 4px 0 #15151c; }
  #dpad .h { left: 0; right: 0; top: 50px; height: 50px; border-radius: 8px; }
  #dpad .v { top: 0; bottom: 0; left: 50px; width: 50px; border-radius: 8px; }
  #dpad .hub { position: absolute; left: 62px; top: 62px; width: 26px; height: 26px; border-radius: 50%; background: #30303c; }
  #dpad .shade { position: absolute; width: 50px; height: 50px; border-radius: 8px; background: var(--btn-down); display: none; }
  #dpad[data-dir="up"] .shade { display: block; left: 50px; top: 0; }
  #dpad[data-dir="down"] .shade { display: block; left: 50px; top: 100px; }
  #dpad[data-dir="left"] .shade { display: block; left: 0; top: 50px; }
  #dpad[data-dir="right"] .shade { display: block; left: 100px; top: 50px; }
  #ab { grid-area: ab; gap: 18px; align-items: center; transform: rotate(-20deg); touch-action: none; }
  #ab button { margin-top: 0; }
  #ab button:first-child { margin-top: 40px; }
  #ab button {
    width: 66px; height: 66px; border-radius: 50%; border: 0;
    background: var(--ab); color: rgba(255,255,255,.75); font: 700 20px system-ui, sans-serif;
    box-shadow: 0 4px 0 #5a1030; touch-action: none;
  }
  #ab button.down { background: var(--ab-down); box-shadow: 0 1px 0 #5a1030; transform: translateY(3px); }
  #meta { grid-area: meta; justify-content: center; gap: 22px; }
  #meta button {
    width: 76px; height: 24px; border-radius: 12px; border: 0; background: var(--btn);
    color: var(--label); font: 700 11px system-ui, sans-serif; letter-spacing: 1px;
    box-shadow: 0 3px 0 #15151c; touch-action: none;
  }
  #meta button.down { background: var(--btn-down); transform: translateY(2px); box-shadow: none; }
</style>
</head>
<body>
<div id="app">
  <div id="screen-wrap"><canvas id="screen" width="320" height="240"></canvas></div>

  <div id="dpad" aria-label="Direction pad">
    <div class="arm h"></div><div class="arm v"></div><div class="shade"></div><div class="hub"></div>
  </div>
  <div id="ab">
    <button data-btn="b" aria-label="B">B</button>
    <button data-btn="a" aria-label="A">A</button>
  </div>
  <div id="meta">
    <button data-btn="start">START</button>
  </div>

  <div id="keys">
    <b>Arrows / WASD</b> move &nbsp;·&nbsp; <b>E / Space</b> A (talk, confirm) &nbsp;·&nbsp;
    <b>X / Shift</b> B (hold to run, back) &nbsp;·&nbsp; <b>Enter</b> Start menu &nbsp;·&nbsp; <b>M</b> Map
  </div>
</div>
<script src="js/font.js"></script>
<script src="js/art.js"></script>
<script src="js/maps.js"></script>
<script src="js/game.js"></script>
</body>
</html>
