<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c1c24">
<title>Haakon Life</title>
<style>
  :root {
    --bg: #1c1c24;
    --shell: #2c2c38;
    --btn: #3a3a48;
    --btn-down: #22222c;
    --ab: #a8285a;
    --ab-down: #7a1840;
    --label: #8a8aa0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #app {
    position: fixed; inset: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display: grid; place-items: center; place-content: center; gap: 14px;
    grid-template-areas: "screen" "keys";
  }
  #screen-wrap {
    grid-area: screen;
    background: var(--shell); padding: 12px; border-radius: 10px 10px 28px 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.04);
  }
  #screen {
    display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    background: #000; border-radius: 2px;
  }
  #keys { grid-area: keys; color: var(--label); font-size: 13px; text-align: center; line-height: 1.6; padding: 0 16px; }
  #keys b { color: #c8c8d8; font-weight: 600; }
  #dpad, #meta, #ab { display: none; }

  /* ---------- touch controls ---------- */
  body.touch #keys { display: none; }
  body.touch #dpad, body.touch #meta, body.touch #ab { display: flex; }
  /* put away while you're playing with a controller (a touch brings them back) */
  body.touch.controller #dpad, body.touch.controller #meta, body.touch.controller #ab { display: none; }
  body.touch.portrait #app {
    grid-template-areas: "screen screen" "dpad ab" "meta meta";
    grid-template-columns: 1fr 1fr; align-content: space-evenly; gap: 10px 0;
  }
  body.touch.landscape #app {
    grid-template-areas: "dpad screen ab" "dpad meta ab";
    grid-template-columns: 1fr auto 1fr; gap: 6px 10px;
  }
  body.touch.controller #app { grid-template-areas: "screen"; grid-template-columns: auto; align-content: center; }
  #dpad {
    grid-area: dpad; position: relative; width: 168px; height: 168px; touch-action: none;
  }
  /* an invisible margin round the pad that still counts as pressing it, so a thumb
     that lands a little outside the cross still registers (the direction comes from
     the angle to the centre, so anywhere in here works) */
  #dpad::before { content: ''; position: absolute; inset: -32px; }
  #dpad .arm { position: absolute; background: var(--btn); box-shadow: 0 4px 0 #15151c; }
  #dpad .h { left: 0; right: 0; top: 56px; height: 56px; border-radius: 8px; }
  #dpad .v { top: 0; bottom: 0; left: 56px; width: 56px; border-radius: 8px; }
  #dpad .hub { position: absolute; left: 70px; top: 70px; width: 28px; height: 28px; border-radius: 50%; background: #30303c; }
  #dpad .shade { position: absolute; width: 56px; height: 56px; border-radius: 8px; background: var(--btn-down); display: none; }
  #dpad[data-dir="up"] .shade { display: block; left: 56px; top: 0; }
  #dpad[data-dir="down"] .shade { display: block; left: 56px; top: 112px; }
  #dpad[data-dir="left"] .shade { display: block; left: 0; top: 56px; }
  #dpad[data-dir="right"] .shade { display: block; left: 112px; top: 56px; }
  /* out in the parking lot it's a thumbstick instead (body.stick): the knob follows your
     thumb, and the base slides after it a little way if you drag on past the edge */
  #dpad .base, #dpad .knob { position: absolute; border-radius: 50%; display: none; transition: transform .12s ease-out; }
  #dpad .base { left: 10px; top: 10px; width: 148px; height: 148px; background: #262630; box-shadow: inset 0 0 0 2px #30303c, inset 0 6px 14px rgba(0,0,0,.45); }
  #dpad .knob { left: 52px; top: 52px; width: 64px; height: 64px; background: var(--btn); box-shadow: 0 4px 0 #15151c, inset 0 0 0 7px #44445a; }
  #dpad.held .base, #dpad.held .knob { transition: none; }
  #dpad.held .knob { background: #4a4a5c; }
  body.stick #dpad .arm, body.stick #dpad .hub, body.stick #dpad .shade { display: none; }
  body.stick #dpad .base, body.stick #dpad .knob { display: block; }
  #ab { grid-area: ab; gap: 18px; align-items: center; transform: rotate(-20deg); touch-action: none; }
  #ab button { margin-top: 0; }
  #ab button:first-child { margin-top: 40px; }
  #ab button {
    width: 66px; height: 66px; border-radius: 50%; border: 0;
    background: var(--ab); color: rgba(255,255,255,.75); font: 700 20px system-ui, sans-serif;
    box-shadow: 0 4px 0 #5a1030; touch-action: none;
  }
  #ab button.down { background: var(--ab-down); box-shadow: 0 1px 0 #5a1030; transform: translateY(3px); }
  #meta { grid-area: meta; justify-content: center; gap: 22px; position: relative; } /* above the pad's margin */
  #meta button {
    width: 76px; height: 24px; border-radius: 12px; border: 0; background: var(--btn);
    color: var(--label); font: 700 11px system-ui, sans-serif; letter-spacing: 1px;
    box-shadow: 0 3px 0 #15151c; touch-action: none;
  }
  #meta button.down { background: var(--btn-down); transform: translateY(2px); box-shadow: none; }

  /* something went wrong and the game can't carry on (see showProblem) */
  #problem {
    display: none; position: fixed; inset: 0; z-index: 10; padding: 24px;
    place-items: center; text-align: center; background: var(--bg); color: #c8c8d8; font-size: 18px; line-height: 1.5;
  }
  #problem.on { display: grid; }
</style>
</head>
<body>
<div id="app">
  <div id="screen-wrap"><canvas id="screen" width="320" height="240"></canvas></div>

  <div id="dpad" aria-label="Direction pad">
    <div class="arm h"></div><div class="arm v"></div><div class="shade"></div><div class="hub"></div>
    <div class="base"></div><div class="knob"></div>
  </div>
  <div id="ab">
    <button data-btn="b" aria-label="B">B</button>
    <button data-btn="a" aria-label="A">A</button>
  </div>
  <div id="meta">
    <button data-btn="start">START</button>
  </div>

  <div id="keys">
    <b>Arrows / WASD</b> move &nbsp;·&nbsp; <b>E / Space</b> A (talk, confirm) &nbsp;·&nbsp;
    <b>Esc</b> back, cancel &nbsp;·&nbsp; <b>X / Shift</b> B &nbsp;·&nbsp; <b>Enter</b> Start menu &nbsp;·&nbsp; <b>M</b> Map
  </div>
</div>
<div id="problem" role="alert"></div>
<script>
// When something goes wrong in the game, word goes to the game server (server/problems.js),
// so it reaches somebody: what broke, where in the code, what you were doing and which
// version you have. Only from the hosted copy with no testing shortcuts in the address (as
// for scores: see BOARD_POSTS in js/game.js), at most five a page load and each one once.
(function () {
  var PROBLEM_URL = 'https://play.haakonlife.com/problem';
  var hosted = /(^|\.)haakonlife\.com$/.test(location.hostname) && !location.hash;
  var sent = {}, count = 0;
  window.reportProblem = function (err) {
    var m = String((err && err.message) || err || 'unknown').slice(0, 300);
    if (!hosted || sent[m] || count >= 5) return;
    sent[m] = true; count++;
    var at = 'starting up';
    try { if (window.problemWhere) at = window.problemWhere(); } catch (e) { /* it'll do without */ }
    var body = JSON.stringify({ m: m, s: String((err && err.stack) || '').slice(0, 1500), at: at, v: window.GAME_VERSION ? +window.GAME_VERSION : 0 });
    try {
      if (navigator.sendBeacon) navigator.sendBeacon(PROBLEM_URL, body);
      else if (window.fetch) fetch(PROBLEM_URL, { method: 'POST', mode: 'no-cors', keepalive: true, body: body }).catch(function () {});
    } catch (e) { /* nothing more to do */ }
  };
  addEventListener('error', function (e) {
    // (a browser extension's script, or somebody else's with nothing to go on: not the game)
    if ((!e.error && /^Script error/.test(e.message)) || /-extension:/.test(e.filename || '')) return;
    window.reportProblem(e.error || e.message);
  });
  addEventListener('unhandledrejection', function (e) { window.reportProblem(e.reason); });

  // Put a message over the page, in place of the game. reload: tapping or pressing a key
  // reloads the page.
  window.showProblem = function (str, reload) {
    var el = document.getElementById('problem');
    el.textContent = str;
    el.className = 'on';
    if (!reload) return;
    var again = function (e) { if (!e.repeat) location.reload(); }; // (not a key that was already held down)
    el.addEventListener('pointerup', again);
    addEventListener('keydown', again);
  };
})();

// Load the game's scripts, always asking the server whether there's a newer copy, so a
// phone picks up an update as soon as it's published instead of reusing a cached one
// (otherwise a browser may keep using a saved copy for a while). Unchanged files come back as a
// tiny "not modified" reply. Opened straight from the folder (file://), or if anything
// goes wrong, the scripts load the ordinary way.
(function () {
  var FILES = ['font', 'art', 'lot', 'maps', 'people', 'music', 'hockey', 'game'];
  var RETRIES = 3, RETRY_MS = 5000;
  // Has the game started? js/game.js says so last thing, as window.GAME. If not (a file that
  // wouldn't load, or one caught halfway through being uploaded, or old files mixed with new
  // ones during a deploy), wait a moment and try again, a few times, before asking.
  function started() {
    var tries = -1; // (-1: this browser can't keep count, so it can't safely try by itself)
    if (window.GAME) { try { sessionStorage.removeItem('bootTries'); } catch (e) { /* no matter */ } return; }
    try { tries = +sessionStorage.getItem('bootTries') || 0; sessionStorage.setItem('bootTries', tries + 1); } catch (e) { /* see above */ }
    if (tries >= 0 && tries < RETRIES) {
      window.showProblem('Haakon Life didn\'t load. Trying again...');
      setTimeout(function () { location.reload(); }, RETRY_MS);
    } else window.showProblem('Haakon Life couldn\'t load. Tap or press a key to try again.', true);
  }
  function plain(i) {
    if (i >= FILES.length) { started(); return; }
    var s = document.createElement('script');
    s.src = 'js/' + FILES[i] + '.js';
    s.onload = function () { plain(i + 1); };
    s.onerror = function () { window.reportProblem('js/' + FILES[i] + '.js would not load'); started(); };
    document.body.appendChild(s);
  }
  if (location.protocol === 'file:' || !window.fetch) { plain(0); return; }
  Promise.all(FILES.map(function (f) {
    return fetch('js/' + f + '.js', { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error(f);
      // the newest file's date doubles as the version shown on the title screen
      var mod = Date.parse(r.headers.get('last-modified'));
      return r.text().then(function (code) { return { f: f, code: code, mod: mod }; });
    });
  })).then(function (all) {
    var newest = Math.max.apply(null, all.map(function (x) { return x.mod || 0; }));
    if (newest) window.GAME_VERSION = new Date(newest);
    all.forEach(function (x) {
      var s = document.createElement('script');
      s.textContent = x.code + '\n//# sourceURL=js/' + x.f + '.js';
      document.body.appendChild(s);
    });
    started();
  }).catch(function () { plain(0); });
})();
</script>
</body>
</html>
